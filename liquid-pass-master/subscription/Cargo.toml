[package]
name = "subscription"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = { version = "1.5.7", default-features = false }
alloy-sol-types = { version = "1.5.7", default-features = false }
stylus-sdk = "0.10.9"

[[bin]]
name = "subscription-abi"
path = "src/main.rs"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]
mini-alloc = ["stylus-sdk/mini-alloc"]
contract-client-gen = []

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true
