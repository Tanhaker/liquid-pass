[package]
name = "contracts"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = { version = "1.5.7", default-features = false }
alloy-sol-types = { version = "1.5.7", default-features = false }
stylus-sdk = "0.10.9"
# default-features = false drops std, pem, and precomputed-tables (a large
# table that trades binary size for verification speed). "ecdsa" is the
# minimum needed to verify; it pulls in arithmetic + ecdsa-core.
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }

[lib]
crate-type = ["lib", "cdylib"]

# Renamed away from "contracts". The scaffold gives the bin and the cdylib the
# same name, so both write target/.../contracts.wasm and whichever builds last
# wins -- the bin's is a 109-byte stub. Distinct name = no collision.
[[bin]]
name = "contracts-abi"
path = "src/main.rs"

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]
mini-alloc = ["stylus-sdk/mini-alloc"]
contract-client-gen = []

# Size-optimised release profile. NOTE: CLAUDE.md specifies opt-level = "z",
# but measured against this codebase "s" is 1,098 bytes SMALLER after
# wasm-opt + brotli (21,016 vs 22,114). Keeping "s" and flagging the deviation.
[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true
