<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Liquid Pass</title>
    <style>
      /* Kept in step with the site's tokens so the extension reads as the
         same product rather than a companion someone else built. */
      :root {
        --ink: #08080b;
        --surface: #101016;
        --raised: #16161e;
        --line: #23232e;
        --text: #f2f2f5;
        --muted: #9a9aa8;
        --faint: #6a6a78;
        --ok: #5eead4;
        --low: #fbbf24;
        --crit: #fb7185;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 320px;
        background: var(--ink);
        color: var(--text);
        font: 13px/1.5 "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 14px 10px;
        border-bottom: 1px solid var(--line);
      }
      header strong { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
      header span { color: var(--muted); font-weight: 400; }
      .form { display: flex; gap: 6px; padding: 12px 14px; }
      input {
        flex: 1;
        min-width: 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
        padding: 7px 9px;
        font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace;
        outline: none;
      }
      input:focus { border-color: #32323f; }
      button {
        background: var(--text);
        color: var(--ink);
        border: 0;
        border-radius: 8px;
        padding: 7px 11px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }
      #state { padding: 0 14px 10px; color: var(--faint); font-size: 11px; }
      ul { list-style: none; margin: 0; padding: 0 10px 10px; max-height: 340px; overflow-y: auto; }
      .pass {
        padding: 10px 11px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        margin-bottom: 7px;
        cursor: pointer;
      }
      .pass:hover { border-color: #32323f; }
      .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .name { font-weight: 500; }
      .time { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
      .time.ok { color: var(--ok); }
      .time.low { color: var(--low); }
      .time.crit { color: var(--crit); }
      .time.dead { color: var(--faint); }
      .meta {
        display: flex;
        justify-content: space-between;
        margin-top: 4px;
        color: var(--faint);
        font-size: 10px;
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }
      footer { display: flex; gap: 6px; padding: 10px 14px 14px; border-top: 1px solid var(--line); }
      footer button {
        flex: 1;
        background: var(--raised);
        color: var(--muted);
        border: 1px solid var(--line);
      }
      footer button:hover { color: var(--text); }
      .note { padding: 0 14px 12px; color: var(--faint); font-size: 10px; }
    </style>
  </head>
  <body>
    <header>
      <svg width="16" height="16" viewBox="0 0 18 18" aria-hidden>
        <circle cx="9" cy="9" r="7" fill="none" stroke="#32323f" stroke-width="2.5" />
        <circle cx="9" cy="9" r="7" fill="none" stroke="#5eead4" stroke-width="2.5"
                stroke-linecap="round" stroke-dasharray="43.98" stroke-dashoffset="14"
                transform="rotate(-90 9 9)" />
      </svg>
      <strong>Liquid<span>Pass</span></strong>
    </header>

    <div class="form">
      <input id="addr" placeholder="0x… address to watch" spellcheck="false" />
      <button id="go">Load</button>
    </div>

    <p id="state"></p>
    <ul id="list"></ul>

    <p class="note">Read-only. Buying and selling happen on the site with your own wallet.</p>

    <footer>
      <button id="market">Market</button>
      <button id="dash">My passes</button>
    </footer>

    <script src="popup.js" type="module"></script>
  </body>
</html>
